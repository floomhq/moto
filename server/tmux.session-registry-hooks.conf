# Managed session registry hooks (installed to /root/.tmux.session-registry-hooks.conf).
# cs-launch must prune + tombstone BEFORE tmux kill-session to avoid the session-closed
# hook rewriting stale rows back into sessions.tsv.
set-hook -g session-created 'run-shell -b "/root/bin/session-registry-sync --quiet >/dev/null 2>&1 || true"'
set-hook -g session-closed 'run-shell -b "/root/bin/session-registry-sync --quiet >/dev/null 2>&1 || true"'
set-hook -g client-attached 'run-shell -b "/root/bin/session-registry-sync --quiet >/dev/null 2>&1 || true"'
